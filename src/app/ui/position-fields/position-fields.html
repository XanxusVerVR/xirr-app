<section class="card">
  <h2>{{ title() }}</h2>
  <div class="fields">
    <label>
      <span>{{ dateLabel() }}</span>
      <input
        type="date"
        [class.invalid]="dateInvalid()"
        [value]="position().date"
        (input)="onDate($event)"
      />
    </label>
    <label>
      <span>{{ amountLabel() }}</span>
      <input
        type="text"
        inputmode="decimal"
        placeholder="0"
        [class.invalid]="amountInvalid()"
        [value]="position().amountText"
        (input)="onAmount($event)"
      />
    </label>
  </div>
</section>
