<section class="card">
  <h2>{{ title() }}</h2>
  <div class="fields">
    <label>
      <span>{{ dateLabel() }}</span>
      <input
        type="date"
        [class.invalid]="dateInvalid()"
        [value]="position().date"
        [attr.aria-invalid]="dateInvalid() ? 'true' : null"
        [attr.aria-describedby]="dateInvalid() ? dateErrorId() : null"
        (input)="onDate($event)"
      />
      @if (dateErrorMessage(); as dateError) {
        <p class="field-error" [id]="dateErrorId()">{{ dateError }}</p>
      }
    </label>
    <label>
      <span>{{ amountLabel() }}</span>
      <input
        type="text"
        inputmode="decimal"
        placeholder="0"
        [class.invalid]="amountInvalid()"
        [value]="position().amountText"
        [attr.aria-invalid]="amountInvalid() ? 'true' : null"
        [attr.aria-describedby]="amountInvalid() ? amountErrorId() : null"
        (input)="onAmount($event)"
      />
      @if (amountErrorMessage(); as amountError) {
        <p class="field-error" [id]="amountErrorId()">{{ amountError }}</p>
      }
    </label>
  </div>
</section>
