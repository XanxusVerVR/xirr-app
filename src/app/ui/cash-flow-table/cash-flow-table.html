<section class="card">
  <h2>資金進出記錄</h2>
  <p class="hint">正數代表資金投入，負數代表資金匯出。可拖曳日期左側的把手調整順序。</p>

  <div class="flow-head">
    <span>日期</span>
    <span>金額</span>
    <span class="actions-col">操作</span>
  </div>

  <div cdkDropList (cdkDropListDropped)="onDrop($event)" class="flow-list">
    @for (row of store.form().rows; track row.id; let i = $index) {
      <div class="flow-row" [class.has-error]="rowHasError(row.id)" cdkDrag>
        <div class="cell date-cell">
          <div class="date-input-row">
            <button
              type="button"
              class="drag-handle"
              cdkDragHandle
              aria-label="拖曳調整順序"
              title="拖曳調整順序"
            >
              ⠿
            </button>
            <input
              type="date"
              [attr.data-row-id]="row.id"
              [value]="row.date"
              [attr.aria-label]="'第 ' + (i + 1) + ' 筆資金進出的日期'"
              [attr.aria-invalid]="fieldHasIssue(row.id, 'date') ? 'true' : null"
              [attr.aria-describedby]="
                fieldIssueMessage(row.id, 'date') ? fieldErrorId(row.id, 'date') : null
              "
              (input)="onDate(row.id, $event)"
              (blur)="onDateBlur(row.id, $event)"
            />
          </div>
          @if (fieldIssueMessage(row.id, 'date'); as dateError) {
            <p class="field-error" [id]="fieldErrorId(row.id, 'date')">{{ dateError }}</p>
          }
        </div>

        <div class="cell amount-cell">
          <input
            type="text"
            inputmode="decimal"
            placeholder="0"
            [value]="row.amountText"
            [attr.aria-label]="'第 ' + (i + 1) + ' 筆資金進出的金額'"
            [attr.aria-invalid]="fieldHasIssue(row.id, 'amount') ? 'true' : null"
            [attr.aria-describedby]="
              fieldIssueMessage(row.id, 'amount') ? fieldErrorId(row.id, 'amount') : null
            "
            (input)="onAmount(row.id, $event)"
          />
          @if (fieldIssueMessage(row.id, 'amount'); as amountError) {
            <p class="field-error" [id]="fieldErrorId(row.id, 'amount')">{{ amountError }}</p>
          }
        </div>

        <div class="cell row-actions">
          <button
            type="button"
            class="duplicate-row"
            (click)="onDuplicate(row.id)"
            title="複製這一筆"
            aria-label="複製這一筆"
          >
            複製
          </button>
          <button
            type="button"
            class="remove-row"
            (click)="store.removeRow(row.id)"
            title="刪除這一筆"
            aria-label="刪除這一筆"
          >
            刪除
          </button>
        </div>
      </div>
    }
  </div>

  <button type="button" class="add-row" (click)="store.addRow()">＋ 新增一筆</button>
</section>
